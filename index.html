<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b17">

  <title>منصة الطالب الهندسي | Physics & Engineering</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      background:
        radial-gradient(circle at 10% 20%, rgba(77, 99, 255, .16), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(0, 217, 255, .12), transparent 30%),
        #070b17;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background effects */
    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .25;
      animation: moveBlob 12s ease-in-out infinite alternate;
    }

    .blob1 {
      width: 350px;
      height: 350px;
      background: #5b5cff;
      top: -100px;
      right: -100px;
    }

    .blob2 {
      width: 400px;
      height: 400px;
      background: #00d9ff;
      bottom: -150px;
      left: -120px;
      animation-delay: 2s;
    }

    @keyframes moveBlob {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(40px, 50px) scale(1.15);
      }
    }

    /* Navbar */
    nav {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(7, 11, 23, .65);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .nav-container {
      width: min(1150px, 92%);
      margin: auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.15rem;
    }

    .logo-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, #5b5cff, #00d9ff);
      box-shadow: 0 0 25px rgba(65, 142, 255, .35);
    }

    .nav-link {
      text-decoration: none;
      color: #c9d0e3;
      font-weight: 600;
      transition: .3s;
    }

    .nav-link:hover {
      color: #fff;
    }

    /* Hero */
    .hero {
      width: min(1150px, 92%);
      margin: auto;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 0 55px;
    }

    .hero-content {
      max-width: 850px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 17px;
      border-radius: 100px;
      background: rgba(91, 92, 255, .12);
      border: 1px solid rgba(112, 129, 255, .3);
      color: #bfc8ff;
      font-size: .9rem;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 7vw, 5rem);
      line-height: 1.2;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #9b9cff, #4ddfff, #87f5cf);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      color: #9fa8bf;
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 2;
      max-width: 680px;
      margin: 0 auto 32px;
    }
